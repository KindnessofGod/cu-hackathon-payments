# XcodeGen spec for the native iPad shell. Built on GitHub's macOS runners (.github/workflows/ios.yml);
# no Mac is needed locally. Installed on the iPad with Sideloadly and a free Apple ID.
name: PayAlone
options:
  bundleIdPrefix: app.payalone
  deploymentTarget:
    iOS: "15.0"
targets:
  PayAlone:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Pay Alone
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSFaceIDUsageDescription: Pay Alone uses your fingerprint or face to approve each payment.
        NSCameraUsageDescription: Pay Alone uses the camera only when you choose to scan a pay code.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.payalone.ipad
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
